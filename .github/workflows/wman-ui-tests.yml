name: WMan UI Tests

on:
  workflow_call:
    inputs:
      project_test_file_path:
        required: true
        type: string
      project_test_category:
        required: false
        type: string
        default: ''
      wmanapi_image_tag:
        required: false
        type: string
        default: latest
      wmanapimessaging_image_tag:
        required: false
        type: string
        default: latest
    secrets:
      nuget_github_server_url:
        required: true
      nuget_github_server_username:
        required: true
      nuget_github_server_password:
        required: true

jobs:
  build:
    runs-on: ['self-hosted', 'Linux']
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'

    - name: Prepare NuGet sources
      shell: bash
      env:
        NUGET_GITHUB_URL: ${{ secrets.nuget_github_server_url }}
        NUGET_GITHUB_USERNAME: ${{ secrets.nuget_github_server_username }}
        NUGET_GITHUB_PASSWORD: ${{ secrets.nuget_github_server_password }}
      run: |
        if dotnet nuget list source | grep -qE '^[[:space:]]*[0-9]+[.] +github \['; then
          dotnet nuget update source github --source "$NUGET_GITHUB_URL" --username "$NUGET_GITHUB_USERNAME" --password "$NUGET_GITHUB_PASSWORD" --store-password-in-clear-text
        else
          dotnet nuget add source --name github "$NUGET_GITHUB_URL" --username "$NUGET_GITHUB_USERNAME" --password "$NUGET_GITHUB_PASSWORD" --store-password-in-clear-text
        fi

    - name: Log in to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run UI Tests
      id: test
      shell: bash
      env:
        TEST_PROJECT: ${{ inputs.project_test_file_path }}
        TEST_CATEGORY: ${{ inputs.project_test_category }}
        WMAN_API_IMAGE_TAG: ${{ inputs.wmanapi_image_tag }}
        WMAN_API_MESSAGING_IMAGE_TAG: ${{ inputs.wmanapimessaging_image_tag }}
        PLAYWRIGHT_TRACES_DIR: ${{ github.workspace }}/TestResults/PlaywrightTraces
      run: |
        arguments=(
          test "$TEST_PROJECT"
          --results-directory ./TestResults
          --logger 'trx;LogFileName=ui-tests-results.trx'
          --logger 'console;verbosity=normal'
        )
        if [[ -n "$TEST_CATEGORY" ]]; then
          arguments+=(--filter "Category~$TEST_CATEGORY")
        fi
        dotnet "${arguments[@]}"

    - name: Upload UI Test Results
      if: ${{ (success() || failure()) && hashFiles('TestResults/*.trx') != '' }}
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: UI Tests Results
        working-directory: ${{ github.workspace }}/TestResults
        path: '*.trx'
        reporter: dotnet-trx
        max-annotations: '50'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload failed UI test traces
      if: ${{ (success() || failure()) && hashFiles('TestResults/PlaywrightTraces/*.zip') != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ui-test-traces
        path: TestResults/PlaywrightTraces/*.zip
        retention-days: 7
