name: Templates zip

on:
  workflow_call:
    inputs:
      templates_name:
        required: true
        type: string
      runner_labels:
        description: JSON array of runner labels; use ["self-hosted", "Linux"] for the Linux runner.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      octo_auto_release_dev:
        description: Deploy builds of release/YYYY.WW.N branches (e.g. release/2026.40.1) to the Octopus Development environment.
        required: false
        type: boolean
        default: false
      octo_auto_release_prod:
        description: Ignored. Production deployments are started by hand in Octopus.
        required: false
        type: boolean
        default: false
      octo_push_build_information:
        required: false
        type: boolean
        default: false
    secrets:
      nuget_github_server_url:
        required: true
      nuget_github_server_username:
        required: true
      nuget_github_server_password:
        required: true
      octopus_server_url:
        required: true
      octopus_server_apikey:
        required: true

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    steps:
    - name: Checkout source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - name: Install GitVersion
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      uses: gittools/actions/gitversion/setup@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
      with:
        versionSpec: '6.x'

    - name: Download GitVersion config
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      run: |
        curl -L https://raw.githubusercontent.com/nowastelogistics/procedures/master/GitVersionConfig.yml -o GitVersionConfig.yml

    - name: Determine Version
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      id: gitversion
      uses: gittools/actions/gitversion/execute@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
      with:
        configFilePath: GitVersionConfig.yml
        disableCache: true

    # Custom version format to match Docker / NuGet requirements. nuGetVersionV2 was removed from GitVersion v6
    - name: Build custom version
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      run: |
        major='${{ steps.gitversion.outputs.major }}'
        minor='${{ steps.gitversion.outputs.minor }}'
        patch='${{ steps.gitversion.outputs.patch }}'
        label='${{ steps.gitversion.outputs.preReleaseLabel }}'
        number='${{ steps.gitversion.outputs.commitsSinceVersionSource }}'

        # zero-pad number to 5 digits (NuGet style)
        padded=$(printf "%05d" "${number:-0}")

        if [ -z "$label" ]; then
          version="${major}.${minor}.${patch}"
        else
          version="${major}.${minor}.${patch}-${label}${padded}"
        fi

        echo "GITVERSION=$version" >> "$GITHUB_ENV"
        echo "Computed version: $version"

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: '10.x'

    - name: Prepare NuGet sources
      env:
        NUGET_URL: ${{ secrets.nuget_github_server_url }}
        NUGET_USERNAME: ${{ secrets.nuget_github_server_username }}
        NUGET_PASSWORD: ${{ secrets.nuget_github_server_password }}
      run: |
        validator_dir=$(mktemp -d "$RUNNER_TEMP/ask-validator.XXXXXX")
        echo "ASK_VALIDATOR_PATH=$validator_dir" >> "$GITHUB_ENV"
        echo "ASK_NUGET_CONFIG=$validator_dir/nuget.config" >> "$GITHUB_ENV"
        dotnet new nugetconfig --output "$validator_dir"
        dotnet nuget add source "$NUGET_URL" --username "$NUGET_USERNAME" --password "$NUGET_PASSWORD" --store-password-in-clear-text --name github --configfile "$validator_dir/nuget.config"

    - name: Install validation tool
      run: |
        if [[ "$GITHUB_REF" == refs/heads/release* ]]; then
          validator_version=$(
            dotnet package search NoEffect.Generator --exact-match --prerelease --format json --configfile "$ASK_NUGET_CONFIG" |
              jq -r '.searchResult[].packages[] | select(.id | ascii_downcase == "noeffect.generator") | .version | select(contains("-rc"))' |
              sort -V |
              tail -n 1
          )

          if [[ -z "$validator_version" ]]; then
            echo "No RC version of NoEffect.Generator was found."
            exit 1
          fi

          echo "Installing NoEffect.Generator $validator_version"
          dotnet tool install NoEffect.Generator --tool-path "$ASK_VALIDATOR_PATH" --configfile "$ASK_NUGET_CONFIG" --version "$validator_version"
        else
          dotnet tool install NoEffect.Generator --tool-path "$ASK_VALIDATOR_PATH" --configfile "$ASK_NUGET_CONFIG"
        fi

    - name: Validate templates
      run: |
        "$ASK_VALIDATOR_PATH/dotnet-ask" validate

    - name: Remove temporary NuGet credentials
      if: always()
      run: |
        if [[ -n "$ASK_NUGET_CONFIG" ]]; then
          rm -f -- "$ASK_NUGET_CONFIG"
        fi

    - name: Install Octopus CLI
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      uses: OctopusDeploy/install-octopus-cli-action@53672953fdc83eef118faf7ac9f15638424bdd3f # v4.1.0
      with:
        version: latest

    - name: Determine Octopus release branch
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      id: octopus-channel
      run: |
          echo "autorelease=false" >> $GITHUB_OUTPUT

          if [[ $GITHUB_REF == 'refs/tags/'* ]]; then
            echo "channel=Production" >> $GITHUB_OUTPUT
            echo "notes=https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else
            echo "channel=Development" >> $GITHUB_OUTPUT
            echo "notes=https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" >> $GITHUB_OUTPUT

            if [[ ${{ inputs.octo_auto_release_dev }} == true ]] && [[ $GITHUB_REF =~ ^refs/heads/release/[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
              echo "autorelease=true" >> $GITHUB_OUTPUT
            fi
          fi

    - name: Write version information
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      run: |
        echo "{\"version\": \"${{ env.GITVERSION }}\"}" > version.json

    - name: Archive Release
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554 # 0.7.6
      with:
        type: 'zip'
        filename: '${{ inputs.templates_name }}.zip'
        exclusions: '*.git* /*node_modules/* .editorconfig GitVersion.yml README.md .vscode*'

    - name: Push build information to Octopus
      if: inputs.octo_push_build_information == true && (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release'))
      env:
        EVENT_BEFORE: ${{ github.event.before }}
        OCTOPUS_SERVER: ${{ secrets.octopus_server_url }}
        OCTOPUS_API_KEY: ${{ secrets.octopus_server_apikey }}
      run: |
        commits_file=$(mktemp)
        build_information_file=$(mktemp)
        trap 'rm -f "$commits_file" "$build_information_file"' EXIT

        if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] \
          && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null \
          && git merge-base --is-ancestor "$EVENT_BEFORE" "$GITHUB_SHA"; then
          commit_ids=($(git rev-list --reverse "$EVENT_BEFORE..$GITHUB_SHA"))
        else
          commit_ids=("$GITHUB_SHA")
        fi

        for commit_id in "${commit_ids[@]}"; do
          subject=$(git show -s --format='%s' "$commit_id")
          if [[ "$subject" == "Merge pull request #"* \
            || "$subject" == "Merge branch "* \
            || "$subject" == "Merge origin/develop into "* \
            || "$subject" == "Merge origin/master into "* \
            || "$subject" == "Merge remote-tracking branch "* ]]; then
            continue
          fi

          author=$(git show -s --format='%an' "$commit_id")
          if [[ "$author" =~ [cC][lL][aA][uU][dD][eE]|[cC][hH][aA][tT][gG][pP][tT]|[cC][oO][dD][eE][xX] ]]; then
            author=''
          fi

          comment="$subject"
          if [[ -n "$author" ]]; then
            comment+="|||$author"
          fi

          jq -n \
            --arg id "$commit_id" \
            --arg comment "$comment" \
            --arg link_url "https://github.com/$GITHUB_REPOSITORY/commit/$commit_id" \
            '{Id: $id, Comment: $comment, LinkUrl: $link_url}' >> "$commits_file"
        done

        jq -n \
          --arg build_number "$GITHUB_RUN_ID/$GITHUB_RUN_NUMBER" \
          --arg build_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --arg branch "$GITHUB_REF_NAME" \
          --arg vcs_root "https://github.com/$GITHUB_REPOSITORY.git" \
          --arg vcs_commit_number "$GITHUB_SHA" \
          --arg vcs_commit_url "https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
          --slurpfile commits "$commits_file" \
          '{BuildEnvironment: "GitHub Actions", BuildNumber: $build_number, BuildUrl: $build_url, Branch: $branch, VcsType: "Git", VcsRoot: $vcs_root, VcsCommitNumber: $vcs_commit_number, VcsCommitUrl: $vcs_commit_url, Commits: $commits}' > "$build_information_file"

        octopus login --server "$OCTOPUS_SERVER" --api-key "$OCTOPUS_API_KEY"
        octopus build-information upload --space "NoWaste" --package-id "${{ inputs.templates_name }}" --version "${{ env.GITVERSION }}" --file "$build_information_file" --overwrite-mode "ignore" --no-prompt

    - name: Octopus Create release
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      run: |
          octopus login --server "${{ secrets.octopus_server_url }}" --api-key "${{ secrets.octopus_server_apikey }}"
          octopus package zip create --id "${{ inputs.templates_name }}" --version "${{ env.GITVERSION }}" --include *.zip
          octopus package upload --space "Spaces-1" --package "${{ inputs.templates_name }}.${{ env.GITVERSION }}.zip"
          octopus release create --space "Spaces-1" --project "${{ inputs.templates_name }}" --version "${{ env.GITVERSION }}" --channel "${{ steps.octopus-channel.outputs.channel }}" --releaseNotes "${{ steps.octopus-channel.outputs.notes }}" --package "${{ inputs.templates_name }}:${{ env.GITVERSION }}"

          if ${{ steps.octopus-channel.outputs.autorelease }}; then
            project="${{ inputs.templates_name }}"
            # Every enabled tenant connected to the project in Development; none means an untenanted deployment.
            project_json=$(octopus project view "$project" --space "Spaces-1" --output-format json)
            project_id=$(jq -r '.Id' <<< "$project_json")
            tenants_json=$(octopus tenant list --space "Spaces-1" --output-format json)
            tenant_names=$(jq -r --arg project_id "$project_id" '.[]? | select(.IsDisabled | not) | select(any(.ProjectEnvironments[]?; .Project.Id == $project_id and any(.Environments[]?; .Name == "Development"))) | .Name' <<< "$tenants_json")
            tenant_args=()
            while IFS= read -r tenant; do
              if [[ -n "$tenant" ]]; then
                tenant_args+=(--tenant "$tenant")
              fi
            done <<< "$tenant_names"
            octopus release deploy --space "Spaces-1" --project "$project" --version "${{ env.GITVERSION }}" --environment "Development" "${tenant_args[@]}" --no-prompt
          fi

          echo '### Template release' >> $GITHUB_STEP_SUMMARY
          echo 'Pushed new release of template **${{ inputs.templates_name }}** version **${{ env.GITVERSION }}** to Octopus' >> $GITHUB_STEP_SUMMARY
