name: Windows deploy build

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      project_file_path:
        required: true
        type: string
      project_test_file_path:
        required: false
        type: string
      octo_auto_release_dev:
        description: Deploy builds of release/YYYY.WW.N branches (e.g. release/2026.40.1) to the Octopus Development environment.
        required: false
        type: boolean
        default: false
      octo_auto_release_prod:
        description: Ignored. Production deployments are started by hand in Octopus.
        required: false
        type: boolean
        default: false
      octo_push_build_information:
        required: false
        type: boolean
        default: false
    secrets:
      nuget_github_server_url:
        required: true
      nuget_github_server_username:
        required: true
      nuget_github_server_password:
        required: true
      octopus_server_url:
        required: true
      octopus_server_apikey:
        required: true

jobs:
  build:
    runs-on: ['self-hosted', 'Windows']
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate CI version
      id: version
      uses: nowastelogistics/procedures/.github/actions/ci-version@ba59c9bf9c12fa3afa7feb2f60c15abb1b6c5ecb

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          10.x
          11.x
        skip-lts-prepass: true

    - name: Install Octopus CLI
      uses: OctopusDeploy/install-octopus-cli-action@v3
      with:
        version: latest

    - name: Prepare NuGet sources
      run: |
        $nugetSources = dotnet nuget list source | Out-String; if(!($nugetSources -like "*github*")) { dotnet nuget add source --username ${{ secrets.nuget_github_server_username }} --password ${{ secrets.nuget_github_server_password }} --store-password-in-clear-text --name github ${{ secrets.nuget_github_server_url }} }

    - name: Run tests
      id: test
      run: |
        if ("${{ inputs.project_test_file_path }}" -and "${{ inputs.project_test_file_path }}" -ne "") {
            "tests-exists=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            dotnet test ${{ inputs.project_test_file_path }} --results-directory ./TestResults --logger "trx;LogFileName=test-results.trx"
        } else {
            "exists=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
        }

    - name: Upload test results
      id: test-reporter
      if: ${{ always() && steps.test.outputs.tests-exists == 'true' }}
      uses: dorny/test-reporter@v1
      with:
        name: Tests
        working-directory: ${{ github.workspace }}/TestResults
        path: '*.trx'
        reporter: dotnet-trx
        max-annotations: '50'
        fail-on-empty: 'true'
        fail-on-error: 'true'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Require passing test results
      if: ${{ always() && steps.test.outputs.tests-exists == 'true' && (steps.test-reporter.outputs.passed == '' || steps.test-reporter.outputs.passed == '0') }}
      run: exit 1

    - name: Build & Pack
      run: |
        dotnet publish ${{ inputs.project_file_path }} -p:Version=${{ steps.version.outputs.version }} --configuration Release --output build --arch x64
        mv nomad/${{ inputs.project_name }}.* build/

    - name: Determine Octopus release branch
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      id: octopus-channel
      run: |
          "autorelease=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

          if ($env:GITHUB_REF -like 'refs/tags/*') {
              "channel=Production" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              "notes=https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          } else {
              "channel=Development" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              "notes=https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

              if ("${{ inputs.octo_auto_release_dev }}" -eq "true" -and $env:GITHUB_REF -cmatch '^refs/heads/release/\d{4}\.\d{1,2}\.\d+$') {
                  "autorelease=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              }
          }


    - name: Push build information to Octopus
      if: inputs.octo_push_build_information == true && (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release'))
      shell: powershell
      env:
        EVENT_BEFORE: ${{ github.event.before }}
        OCTOPUS_SERVER: ${{ secrets.octopus_server_url }}
        OCTOPUS_API_KEY: ${{ secrets.octopus_server_apikey }}
        PACKAGE_ID: ${{ inputs.project_name }}
      run: |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
        $commitIds = @($env:GITHUB_SHA)
        if ($env:EVENT_BEFORE -and $env:EVENT_BEFORE -notmatch '^0+$') {
            # Windows PowerShell treats native stderr as errors with Stop enabled.
            $savedErrorActionPreference = $ErrorActionPreference
            try {
                $ErrorActionPreference = 'Continue'
                git cat-file -e "$($env:EVENT_BEFORE)^{commit}" 2>$null
                $beforeExists = $LASTEXITCODE -eq 0
            } finally {
                $ErrorActionPreference = $savedErrorActionPreference
            }
            if ($beforeExists) {
                git merge-base --is-ancestor $env:EVENT_BEFORE $env:GITHUB_SHA
                if ($LASTEXITCODE -eq 0) {
                    $commitIds = @(git rev-list --reverse "$($env:EVENT_BEFORE)..$($env:GITHUB_SHA)")
                    if ($LASTEXITCODE -ne 0) { throw 'Could not read commit range.' }
                }
            }
        }

        $seenCommitIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
        $commits = @(
            foreach ($commitId in $commitIds) {
                if (-not $seenCommitIds.Add($commitId)) { continue }
                $parentIds = git show -s --format=%P $commitId
                if ($LASTEXITCODE -ne 0) { throw 'Could not read commit parents.' }
                $parents = @(([string]$parentIds -split '\s+') | Where-Object { $_ })
                if ($parents.Count -gt 1) { continue }
                $subject = git show -s --format=%s $commitId
                if ($LASTEXITCODE -ne 0) { throw 'Could not read commit subject.' }
                $subject = ($subject -replace '(?i)\[(build|skip ci|ci skip|no ci)\]', '' -replace '\s+', ' ').Trim()
                if ([string]::IsNullOrWhiteSpace($subject)) { continue }
                $author = git show -s --format=%an $commitId
                if ($LASTEXITCODE -ne 0) { throw 'Could not read commit author.' }
                if ($author -match 'claude|chatgpt|codex') { $author = '' }
                $comment = $subject
                if ($author) { $comment += "|||$author" }
                @{
                    Id = $commitId
                    Comment = $comment
                    LinkUrl = "https://github.com/$env:GITHUB_REPOSITORY/commit/$commitId"
                }
            }
        )
        $buildInformation = @{
            BuildEnvironment = 'GitHub Actions'
            BuildNumber = "$env:GITHUB_RUN_ID/$env:GITHUB_RUN_NUMBER"
            BuildUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            Branch = $env:GITHUB_REF_NAME
            VcsType = 'Git'
            VcsRoot = "https://github.com/$env:GITHUB_REPOSITORY.git"
            VcsCommitNumber = $env:GITHUB_SHA
            VcsCommitUrl = "https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
            Commits = $commits
        }
        $buildInformationFile = Join-Path $env:RUNNER_TEMP "octopus-build-information-$([guid]::NewGuid()).json"
        try {
            $json = $buildInformation | ConvertTo-Json -Depth 5
            [System.IO.File]::WriteAllText($buildInformationFile, $json, [System.Text.UTF8Encoding]::new($false))
            octopus login --server $env:OCTOPUS_SERVER --api-key $env:OCTOPUS_API_KEY
            if ($LASTEXITCODE -ne 0) { throw 'Octopus login failed.' }
            octopus build-information upload --space 'Spaces-1' --package-id $env:PACKAGE_ID --version ${{ steps.version.outputs.version }} --file $buildInformationFile --overwrite-mode ignore --no-prompt
            if ($LASTEXITCODE -ne 0) { throw 'Octopus build information upload failed.' }
        } finally {
            if (Test-Path -LiteralPath $buildInformationFile) {
                Remove-Item -LiteralPath $buildInformationFile
            }
        }

    - name: Octopus Create release
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      run: |
        octopus login --server "${{ secrets.octopus_server_url }}" --api-key "${{ secrets.octopus_server_apikey }}"
        octopus package zip create --id "${{ inputs.project_name }}" --version "${{ steps.version.outputs.version }}" --base-path "build" --include="**"
        octopus package upload --space "Spaces-1" --package "${{ inputs.project_name }}.${{ steps.version.outputs.version }}.zip"
        octopus release create --space "Spaces-1" --project "${{ inputs.project_name }}" --version "${{ steps.version.outputs.version }}" --channel "${{ steps.octopus-channel.outputs.channel }}" --releaseNotes "${{ steps.octopus-channel.outputs.notes }}" --package "${{ inputs.project_name }}:${{ steps.version.outputs.version }}"

        if ("${{ steps.octopus-channel.outputs.autorelease }}" -eq "true") {
            $project = "${{ inputs.project_name }}"
            # Every enabled tenant connected to the project in Development; none means an untenanted deployment.
            $projectJson = octopus project view $project --space "Spaces-1" --output-format json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $projectId = ($projectJson | Out-String | ConvertFrom-Json).Id
            $tenantsJson = octopus tenant list --space "Spaces-1" --output-format json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tenantArgs = @(($tenantsJson | Out-String | ConvertFrom-Json) |
                Where-Object { -not $_.IsDisabled -and ($_.ProjectEnvironments | Where-Object { $_.Project.Id -ceq $projectId -and $_.Environments.Name -ccontains "Development" }) } |
                ForEach-Object { "--tenant"; $_.Name })
            octopus release deploy --space "Spaces-1" --project $project --version "${{ steps.version.outputs.version }}" --environment "Development" @tenantArgs --no-prompt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

        "### Octopus release" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
        "Pushed new release of docker container **${{ inputs.project_name }}** version **${{ steps.version.outputs.version }}** to Octopus" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
