name: Windows deploy build

on:
  workflow_call:
    inputs:
      project_name:
        required: true
        type: string
      project_file_path:
        required: true
        type: string
      project_test_file_path:
        required: false
        type: string
      octo_auto_release_dev:
        required: false
        type: boolean
        default: false
      octo_auto_release_prod:
        required: false
        type: boolean
        default: false
      octo_push_build_information:
        required: false
        type: boolean
        default: false
    secrets:
      nuget_github_server_url:
        required: true
      nuget_github_server_username:
        required: true
      nuget_github_server_password:
        required: true
      octopus_server_url:
        required: true
      octopus_server_apikey:
        required: true

jobs:
  build:
    runs-on: ['self-hosted', 'Windows']
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.2.0
      with:
        versionSpec: '6.x'

    - name: Download GitVersion config (force real curl)
      run: |
        C:\Windows\System32\curl.exe -L https://raw.githubusercontent.com/nowastelogistics/procedures/master/GitVersionConfig.yml -o GitVersionConfig.yml

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.2.0
      with:
        useConfigFile: true
        configFilePath: GitVersionConfig.yml
        additionalArguments: '/diag /nocache' 
        
    - name: Build custom version (Windows / cmd)
      shell: cmd
      run: |
        @echo off
        setlocal enabledelayedexpansion

        rem === Extract GitVersion outputs ===
        set major=${{ steps.gitversion.outputs.major }}
        set minor=${{ steps.gitversion.outputs.minor }}
        set patch=${{ steps.gitversion.outputs.patch }}
        set label=${{ steps.gitversion.outputs.preReleaseLabel }}
        set number=${{ steps.gitversion.outputs.preReleaseNumber }}
        if "%number%"=="" set number=${{ steps.gitversion.outputs.commitsSinceVersionSource }}

        rem === If label is empty and we are on a release/* branch, force rc ===
        set branch=%GITHUB_REF_NAME%
        echo Branch is %branch%
        echo Label before check: %label%
        echo Number before check: %number%
        echo.
        echo.

        rem === Zero-pad to 5 digits ===
        set padded=00000%number%
        set padded=%padded:~-5%

        rem === Build version string ===
        if "%label%"=="" (
          set version=%major%.%minor%.%patch%
        ) else (
          set version=%major%.%minor%.%patch%-%label%%padded%
        )

        echo Computed version: %version%

        rem === Export to GITHUB_ENV ===
        echo GITVERSION=%version%>> %GITHUB_ENV%


    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Install Octopus CLI
      uses: OctopusDeploy/install-octopus-cli-action@v3
      with:
        version: latest

    - name: Prepare NuGet sources
      run: |
        $nugetSources = dotnet nuget list source | Out-String; if(!($nugetSources -like "*github*")) { dotnet nuget add source --username ${{ secrets.nuget_github_server_username }} --password ${{ secrets.nuget_github_server_password }} --store-password-in-clear-text --name github ${{ secrets.nuget_github_server_url }} }

    - name: Run tests
      id: test
      run: |
        if ("${{ inputs.project_test_file_path }}" -and "${{ inputs.project_test_file_path }}" -ne "") {
            "tests-exists=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            dotnet test ${{ inputs.project_test_file_path }} --results-directory ./TestResults --logger "trx;LogFileName=test-results.trx"
        } else {
            "exists=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
        }

    - name: Upload test results
      if: (success() || failure()) && steps.test.outputs.tests-exists == 'true'
      uses: dorny/test-reporter@v1
      with:
        name: Tests
        working-directory: ${{ github.workspace }}/TestResults
        path: '*.trx'
        reporter: dotnet-trx
        max-annotations: '50'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & Pack
      run: |
        dotnet publish ${{ inputs.project_file_path }} -p:Version=${{ env.GITVERSION }} --configuration Release --output build --arch x64
        mv nomad/${{ inputs.project_name }}.* build/

    - name: Determine Octopus release branch
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      id: octopus-channel
      run: |
          "autorelease=false" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

          if ($env:GITHUB_REF -like 'refs/tags/*') {
              "channel=Production" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              "notes=https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:GITHUB_REF_NAME" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

              if ($env:INPUTS_OCTO_AUTO_RELEASE_PROD -eq "true") {
                  "autorelease=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              }
          } else {
              "channel=Development" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              "notes=https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

              if ($env:INPUTS_OCTO_AUTO_RELEASE_DEV -eq "true" -and $env:GITHUB_REF_NAME -like "refs/heads/release*") {
                  "autorelease=true" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
              }
          }


    - name: Push build information to Octopus
      if: inputs.octo_push_build_information == true && (startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release'))
      shell: powershell
      env:
        EVENT_BEFORE: ${{ github.event.before }}
        OCTOPUS_SERVER: ${{ secrets.octopus_server_url }}
        OCTOPUS_API_KEY: ${{ secrets.octopus_server_apikey }}
        PACKAGE_ID: ${{ inputs.project_name }}
      run: |
        $ErrorActionPreference = 'Stop'
        [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
        $commitIds = @($env:GITHUB_SHA)
        if ($env:EVENT_BEFORE -and $env:EVENT_BEFORE -notmatch '^0+$') {
            # Windows PowerShell treats native stderr as errors with Stop enabled.
            $savedErrorActionPreference = $ErrorActionPreference
            try {
                $ErrorActionPreference = 'Continue'
                git cat-file -e "$($env:EVENT_BEFORE)^{commit}" 2>$null
                $beforeExists = $LASTEXITCODE -eq 0
            } finally {
                $ErrorActionPreference = $savedErrorActionPreference
            }
            if ($beforeExists) {
                git merge-base --is-ancestor $env:EVENT_BEFORE $env:GITHUB_SHA
                if ($LASTEXITCODE -eq 0) {
                    $commitIds = @(git rev-list --reverse "$($env:EVENT_BEFORE)..$($env:GITHUB_SHA)")
                    if ($LASTEXITCODE -ne 0) { throw 'Could not read commit range.' }
                }
            }
        }

        $commits = @(
            foreach ($commitId in $commitIds) {
                $subject = git show -s --format=%s $commitId
                if ($LASTEXITCODE -ne 0) { throw 'Could not read commit subject.' }
                if ($subject -like 'Merge pull request #*' -or
                    $subject -like "Merge branch 'master' into *" -or
                    $subject -like 'Merge origin/develop into *' -or
                    $subject -like "Merge remote-tracking branch 'origin/develop'*") { continue }
                $author = git show -s --format=%an $commitId
                if ($LASTEXITCODE -ne 0) { throw 'Could not read commit author.' }
                if ($author -match 'claude|chatgpt|codex') { $author = '' }
                $comment = $subject
                if ($author) { $comment += "|||$author" }
                @{
                    Id = $commitId
                    Comment = $comment
                    LinkUrl = "https://github.com/$env:GITHUB_REPOSITORY/commit/$commitId"
                }
            }
        )
        $buildInformation = @{
            BuildEnvironment = 'GitHub Actions'
            BuildNumber = "$env:GITHUB_RUN_ID/$env:GITHUB_RUN_NUMBER"
            BuildUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            Branch = $env:GITHUB_REF_NAME
            VcsType = 'Git'
            VcsRoot = "https://github.com/$env:GITHUB_REPOSITORY.git"
            VcsCommitNumber = $env:GITHUB_SHA
            VcsCommitUrl = "https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
            Commits = $commits
        }
        $buildInformationFile = Join-Path $env:RUNNER_TEMP "octopus-build-information-$([guid]::NewGuid()).json"
        try {
            $json = $buildInformation | ConvertTo-Json -Depth 5
            [System.IO.File]::WriteAllText($buildInformationFile, $json, [System.Text.UTF8Encoding]::new($false))
            octopus login --server $env:OCTOPUS_SERVER --api-key $env:OCTOPUS_API_KEY
            if ($LASTEXITCODE -ne 0) { throw 'Octopus login failed.' }
            octopus build-information upload --space 'Spaces-1' --package-id $env:PACKAGE_ID --version $env:GITVERSION --file $buildInformationFile --overwrite-mode ignore --no-prompt
            if ($LASTEXITCODE -ne 0) { throw 'Octopus build information upload failed.' }
        } finally {
            if (Test-Path -LiteralPath $buildInformationFile) {
                Remove-Item -LiteralPath $buildInformationFile
            }
        }

    - name: Octopus Create release
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      run: |
        octopus login --server "${{ secrets.octopus_server_url }}" --api-key "${{ secrets.octopus_server_apikey }}"
        octopus package zip create --id "${{ inputs.project_name }}" --version "${{ env.GITVERSION }}" --base-path "build" --include="**"
        octopus package upload --space "Spaces-1" --package "${{ inputs.project_name }}.${{ env.GITVERSION }}.zip"
        octopus release create --space "Spaces-1" --project "${{ inputs.project_name }}" --version "${{ env.GITVERSION }}" --channel "${{ steps.octopus-channel.outputs.channel }}" --releaseNotes "${{ steps.octopus-channel.outputs.notes }}" --package "${{ inputs.project_name }}:${{ env.GITVERSION }}"

        if ($env:STEPS_OCTOPUS_CHANNEL_OUTPUTS_AUTORELEASE -eq "true") {
            octopus deploy-release --project "${{ inputs.project_name }}" --version "${{ env.GITVERSION }}" --tenant "*" --deployTo "${{ steps.octopus-channel.outputs.channel }}"
        }

        "### Octopus release" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
        "Pushed new release of docker container **${{ inputs.project_name }}** version **$env:GitVersion_NuGetVersionV2** to Octopus" | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
