name: Label zip

on:
  workflow_call:
    inputs:
      label_name:
        required: true
        type: string
      octo_auto_release_dev:
        description: Deploy builds of release/YYYY.WW.N branches (e.g. release/2026.40.1) to the Octopus Development environment.
        required: false
        type: boolean
        default: false
      octo_auto_release_prod:
        description: Ignored. Production deployments are started by hand in Octopus.
        required: false
        type: boolean
        default: false
    secrets:
      octopus_server_url:
        required: true
      octopus_server_apikey:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3.0.0
      with:
        versionSpec: '5.x'

    - name: Determine Version
      uses: gittools/actions/gitversion/execute@v3.0.0
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml

    - name: Install Octopus CLI
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      uses: OctopusDeploy/install-octopus-cli-action@v3
      with:
        version: latest

    - name: Determine Octopus release branch
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      id: octopus-channel
      run: |
          echo "autorelease=false" >> $GITHUB_OUTPUT

          if [[ $GITHUB_REF == 'refs/tags/'* ]]; then
            echo "channel=Production" >> $GITHUB_OUTPUT
            echo "notes=https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          else
            echo "channel=Development" >> $GITHUB_OUTPUT
            echo "notes=https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" >> $GITHUB_OUTPUT

            if [[ ${{ inputs.octo_auto_release_dev }} == true ]] && [[ $GITHUB_REF =~ ^refs/heads/release/[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]]; then
              echo "autorelease=true" >> $GITHUB_OUTPUT
            fi
          fi

    - name: Archive Release
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      uses: thedoctor0/zip-release@0.7.5
      with:
        type: 'zip'
        filename: '${{ inputs.label_name }}.zip'
        exclusions: '*.git* /*node_modules/* .editorconfig GitVersion.yml'

    - name: Octopus Create release
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      run: |
          octopus login --server "${{ secrets.octopus_server_url }}" --api-key "${{ secrets.octopus_server_apikey }}"
          octopus package zip create --id "${{ inputs.label_name }}" --version "${{ env.GitVersion_NuGetVersionV2 }}"
          octopus package upload --space "Spaces-1" --package "${{ inputs.label_name }}.${{ env.GitVersion_NuGetVersionV2 }}.zip"
          octopus release create --space "Spaces-1" --project "${{ inputs.label_name }}" --version "${{ env.GitVersion_NuGetVersionV2 }}" --channel "${{ steps.octopus-channel.outputs.channel }}" --releaseNotes "${{ steps.octopus-channel.outputs.notes }}" --package "${{ inputs.label_name }}:${{ env.GitVersion_NuGetVersionV2 }}"

          if ${{ steps.octopus-channel.outputs.autorelease }}; then
            project="${{ inputs.label_name }}"
            # Every enabled tenant connected to the project in Development; none means an untenanted deployment.
            project_json=$(octopus project view "$project" --space "Spaces-1" --output-format json)
            project_id=$(jq -r '.Id' <<< "$project_json")
            tenants_json=$(octopus tenant list --space "Spaces-1" --output-format json)
            tenant_names=$(jq -r --arg project_id "$project_id" '.[]? | select(.IsDisabled | not) | select(any(.ProjectEnvironments[]?; .Project.Id == $project_id and any(.Environments[]?; .Name == "Development"))) | .Name' <<< "$tenants_json")
            tenant_args=()
            while IFS= read -r tenant; do
              if [[ -n "$tenant" ]]; then
                tenant_args+=(--tenant "$tenant")
              fi
            done <<< "$tenant_names"
            octopus release deploy --space "Spaces-1" --project "$project" --version "${{ env.GitVersion_NuGetVersionV2 }}" --environment "Development" "${tenant_args[@]}" --no-prompt
          fi

          echo '### Template release' >> $GITHUB_STEP_SUMMARY
          echo 'Pushed new release of template **${{ inputs.label_name }}** version **${{ env.GitVersion_NuGetVersionV2 }}** to Octopus' >> $GITHUB_STEP_SUMMARY
