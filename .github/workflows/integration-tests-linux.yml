name: Integration Tests

on:
  workflow_call:
    inputs:
      project_test_file_path:
        required: true
        type: string
    secrets:
        nuget_github_server_url:
          required: true
        nuget_github_server_username:
          required: true
        nuget_github_server_password:
          required: true

jobs:
  build:
    runs-on: ['self-hosted', 'Linux']

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'

    - name: Prepare NuGet sources
      run: |
        if dotnet nuget list source | grep -qE '^[[:space:]]*[0-9]+[.] +github \['; then
          dotnet nuget update source github --source "${{ secrets.nuget_github_server_url }}" --username "${{ secrets.nuget_github_server_username }}" --password "${{ secrets.nuget_github_server_password }}" --store-password-in-clear-text
        else
          dotnet nuget add source --name github "${{ secrets.nuget_github_server_url }}" --username "${{ secrets.nuget_github_server_username }}" --password "${{ secrets.nuget_github_server_password }}" --store-password-in-clear-text
        fi

    - name: Run Integration Tests
      id: test
      run: dotnet test ${{ inputs.project_test_file_path }} --results-directory ./TestResults --logger "trx;LogFileName=integration-tests-results.trx"

    - name: Upload Integration Tests Results
      id: test-reporter
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      if: ${{ always() }}
      with:
        name: Integration Tests Results
        working-directory: ${{ github.workspace }}/TestResults
        path: '*.trx'
        reporter: dotnet-trx
        max-annotations: '50'
        fail-on-empty: 'true'
        fail-on-error: 'true'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Require passing test results
      if: ${{ always() && (steps.test-reporter.outputs.passed == '' || steps.test-reporter.outputs.passed == '0') }}
      run: exit 1
