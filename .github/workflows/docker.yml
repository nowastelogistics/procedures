name: Docker build

on:
  workflow_call:
    inputs:
      docker_file_path:
        required: true
        type: string
      docker_image_name:
        required: true
        type: string
      docker_has_tests:
        required: false
        type: boolean
        default: false
      docker_has_code_coverage:
        required: false
        type: boolean
        default: false
      octo_auto_release_dev:
        required: false
        type: boolean
        default: false
      octo_auto_release_prod:
        required: false
        type: boolean
        default: false
      octo_push_build_information:
        required: false
        type: boolean
        default: false
    secrets:
      docker_server_url:
        required: true
      docker_server_username:
        required: true
      docker_server_password:
        required: true
      nuget_github_server_url:
        required: true
      nuget_github_server_username:
        required: true
      nuget_github_server_password:
        required: true
      octopus_server_url:
        required: true
      octopus_server_apikey:
        required: true


jobs:
  build:
    # Self-hosted runner configuration (restore this when moving builds back):
    # runs-on: ['self-hosted', 'Linux']
    runs-on: ubuntu-24.04
    outputs:
      gitversion: ${{ steps.version.outputs.gitversion }}
      image_digest: ${{ steps.promote.outputs.digest }}
    permissions:
      contents: write
      checks: write
      packages: write
      pull-requests: write

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
      with:
        versionSpec: '6.x'

    - name: Download GitVersion config
      run: curl -L https://raw.githubusercontent.com/nowastelogistics/procedures/master/GitVersionConfig.yml -o GitVersionConfig.yml
      
    - name: Show config with line numbers
      run: |
        nl -ba GitVersionConfig.yml | sed -n '1,120p'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@bc6623af8fc07d5a8903052dd46da33403eec8e8 # v4.5.0
      with:
        configFilePath: GitVersionConfig.yml
        
    - run: |
        echo "SemVer=${{ steps.gitversion.outputs.semVer }}"
        echo "SemVerFull=${{ steps.gitversion.outputs.fullSemVer }}"
        echo "SemVer=${{ steps.gitversion.outputs.semVer }}"
        echo "SemVerFull=${{ steps.gitversion.outputs.fullSemVer }}"
        echo "PreReleaseTag=${{ steps.gitversion.outputs.preReleaseTag }}"
        echo "PreReleaseLabel=${{ steps.gitversion.outputs.preReleaseLabel }}"
        echo "PreReleaseNumber=${{ steps.gitversion.outputs.preReleaseNumber }}"
        echo "CommitsSinceVersionSource=${{ steps.gitversion.outputs.commitsSinceVersionSource }}"
        echo "GitBranchName=${{ steps.gitversion.outputs.branchName }}"
        
    # Custom version format to match Docker / NuGet requirements. nuGetVersionV2 was removed from GitVersion v6
    - name: Build custom version
      id: version
      run: |
        major='${{ steps.gitversion.outputs.major }}'
        minor='${{ steps.gitversion.outputs.minor }}'
        patch='${{ steps.gitversion.outputs.patch }}'
        label='${{ steps.gitversion.outputs.preReleaseLabel }}'
        number='${{ steps.gitversion.outputs.commitsSinceVersionSource }}'

        # zero-pad number to 5 digits (NuGet style)
        padded=$(printf "%05d" "${number:-0}")

        if [ -z "$label" ]; then
          version="${major}.${minor}.${patch}"
        else
          version="${major}.${minor}.${patch}-${label}${padded}"
        fi

        echo "GITVERSION=$version" >> "$GITHUB_ENV"
        echo "gitversion=$version" >> "$GITHUB_OUTPUT"
        echo "Computed version: $version"

    - name: Setup buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      id: buildx
      with:
        # Persistent named builders are useful on self-hosted runners only.
        # name: buildx-${{ runner.name }}
        # keep-state: true
        driver-opts: image=moby/buildkit:v0.30.0

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ secrets.docker_server_url }}
        username: ${{ secrets.docker_server_username }}
        password: ${{ secrets.docker_server_password }}

    - name: Compute image references
      id: image
      run: |
          image_repo="${{ secrets.docker_server_url }}/${{ secrets.docker_server_username }}/${{ inputs.docker_image_name }}"
          temp_tag="$image_repo:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache_ref="$image_repo:buildcache"

          echo "repo=$image_repo" >> "$GITHUB_OUTPUT"
          echo "temp_tag=$temp_tag" >> "$GITHUB_OUTPUT"
          echo "cache_ref=$cache_ref" >> "$GITHUB_OUTPUT"
          {
            echo "publish_tags<<EOF"
            echo "$image_repo:${{ env.GITVERSION }}"
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              echo "$image_repo:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

    - name: Build Docker image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: ${{ inputs.docker_file_path }}
        push: true
        build-args: |
          NUGET_GITHUB_SERVER_URL=${{ secrets.nuget_github_server_url }}
          NUGET_GITHUB_SERVER_USERNAME=${{ secrets.nuget_github_server_username }}
          NUGET_GITHUB_SERVER_PASSWORD=${{ secrets.nuget_github_server_password }}
          GITVERSION=${{ env.GITVERSION }}
        cache-from: type=registry,ref=${{ steps.image.outputs.cache_ref }}
        cache-to: type=registry,ref=${{ steps.image.outputs.cache_ref }},mode=max
        provenance: false
        tags: ${{ steps.image.outputs.temp_tag }}

    - name: Pull image for test-result extraction
      if: inputs.docker_has_tests == true
      run: docker pull "${{ steps.image.outputs.temp_tag }}"

    - name: Extract test results
      if: inputs.docker_has_tests == true
      run: |
            container_name="wmanapi-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

            docker create -ti --name "$container_name" "${{ steps.image.outputs.temp_tag }}" bash
            docker cp "$container_name:/TestResults/." ./TestResults

            if [[ ${{ inputs.docker_has_code_coverage }} == true ]]; then
              cp TestResults/*/coverage.cobertura.xml TestResults/coverage.cobertura.xml
            fi

    - name: Upload test results
      if: (success() || failure()) && hashFiles('TestResults/*.trx') != ''
      uses: dorny/test-reporter@a6ddd83ac95ff4586f5d3aceeb314d9a1841db95 # v3.0.0
      with:
        name: Tests
        working-directory: ${{ github.workspace }}/TestResults
        path: '*.trx'
        reporter: dotnet-trx
        max-annotations: '50'
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Coverage summary
      id: coverage
      if: inputs.docker_has_code_coverage == true && hashFiles('TestResults/*.xml') != ''
      uses: insightsengineering/coverage-action@f3f8cdb7a8863fb60236982ac44b9ae63c768cd4 # v3
      with:
        path: TestResults/coverage.cobertura.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        publish: true
        fail: false
        exclude-detailed-coverage: true
        togglable-report: true
        diff: false

    - name: Write coverage markdown
      if: inputs.docker_has_code_coverage == true && steps.coverage.outcome == 'success'
      run: |
        printf "%s\n" "${{ steps.coverage.outputs.summary }}" > code-coverage-results.md
        wc -c code-coverage-results.md
        sed -n '1,40p' code-coverage-results.md

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
      if: inputs.docker_has_code_coverage == true && steps.coverage.outcome == 'success' && github.event_name == 'pull_request'
      with:
        number: ${{ github.event.pull_request.number }}
        recreate: true
        path: code-coverage-results.md

    - name: Promote Docker image
      if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release')
      id: promote
      run: |
          source_ref="${{ steps.image.outputs.repo }}@${{ steps.build.outputs.digest }}"
          tags=()

          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done <<'EOF'
          ${{ steps.image.outputs.publish_tags }}
          EOF

          docker buildx imagetools create "${tags[@]}" "$source_ref"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  sign:
    runs-on: ubuntu-24.04
    needs: build
    if: needs.build.outputs.image_digest != ''
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Docker Login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ secrets.docker_server_url }}
        username: ${{ secrets.docker_server_username }}
        password: ${{ secrets.docker_server_password }}

    - name: Install cosign
      uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
      with:
        cosign-release: v3.0.6

    - name: Sign published image
      env:
        IMAGE_REF: ${{ secrets.docker_server_url }}/${{ secrets.docker_server_username }}/${{ inputs.docker_image_name }}@${{ needs.build.outputs.image_digest }}
      run: |
        cosign sign --yes "$IMAGE_REF"

    - name: Generate SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ secrets.docker_server_url }}/${{ secrets.docker_server_username }}/${{ inputs.docker_image_name }}@${{ needs.build.outputs.image_digest }}
        registry-username: ${{ secrets.docker_server_username }}
        registry-password: ${{ secrets.docker_server_password }}
        format: spdx-json
        syft-version: v1.42.4
        artifact-name: ${{ inputs.docker_image_name }}-sbom-${{ needs.build.outputs.gitversion }}
        output-file: ${{ github.workspace }}/${{ inputs.docker_image_name }}-sbom.spdx.json
        upload-release-assets: false

    - name: Attach SBOM attestation
      env:
        IMAGE_REF: ${{ secrets.docker_server_url }}/${{ secrets.docker_server_username }}/${{ inputs.docker_image_name }}@${{ needs.build.outputs.image_digest }}
        SBOM_FILE: ${{ github.workspace }}/${{ inputs.docker_image_name }}-sbom.spdx.json
      run: |
        cosign attest --yes --predicate "$SBOM_FILE" --type spdxjson "$IMAGE_REF"

    - name: Install Octopus CLI
      uses: OctopusDeploy/install-octopus-cli-action@53672953fdc83eef118faf7ac9f15638424bdd3f # v4.1.0
      with:
        version: 2.21.0

    - name: Determine Octopus release branch
      id: octopus-channel
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
          notes_file="$RUNNER_TEMP/octopus-release-notes.md"
          echo "autorelease=false" >> $GITHUB_OUTPUT

          if [[ $GITHUB_REF == 'refs/tags/'* ]]; then
            echo "channel=Production" >> $GITHUB_OUTPUT
            release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
            release_response_file="$RUNNER_TEMP/github-release.json"
            release_body_file="$RUNNER_TEMP/github-release-body.md"

            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$release_response_file"; then
              if jq -r '.body // ""' "$release_response_file" > "$release_body_file" && grep -q '[^[:space:]]' "$release_body_file"; then
                canonical_release_url=$(jq -r '.html_url // empty' "$release_response_file")
                if [[ -z "$canonical_release_url" ]]; then
                  canonical_release_url="$release_url"
                fi

                cp "$release_body_file" "$notes_file"
                printf '\n\nSource: [GitHub release](%s)\n' "$canonical_release_url" >> "$notes_file"
                echo "::notice::Using GitHub Release notes for tag $GITHUB_REF_NAME."
              else
                printf '%s\n' "$release_url" > "$notes_file"
                echo "::notice::GitHub Release $GITHUB_REF_NAME has no notes; using the release URL."
              fi
            else
              printf '%s\n' "$release_url" > "$notes_file"
              echo "::warning::Could not retrieve GitHub Release $GITHUB_REF_NAME; using the release URL."
            fi

            if [[ ${{ inputs.octo_auto_release_prod }} == true ]]; then
              echo "autorelease=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "channel=Development" >> $GITHUB_OUTPUT
            printf 'https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$notes_file"

            if [[ ${{ inputs.octo_auto_release_dev }} == true ]] && [[ $GITHUB_REF_NAME == "refs/heads/release"* ]]; then
              echo "autorelease=true" >> $GITHUB_OUTPUT
            fi
          fi

          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

    - name: Push build information to Octopus
      if: inputs.octo_push_build_information == true
      env:
        EVENT_BEFORE: ${{ github.event.before }}
        OCTOPUS_SERVER: ${{ secrets.octopus_server_url }}
        OCTOPUS_API_KEY: ${{ secrets.octopus_server_apikey }}
      run: |
        commits_file=$(mktemp)
        build_information_file=$(mktemp)
        trap 'rm -f "$commits_file" "$build_information_file"' EXIT

        if [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]] \
          && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null \
          && git merge-base --is-ancestor "$EVENT_BEFORE" "$GITHUB_SHA"; then
          commit_ids=($(git rev-list --reverse "$EVENT_BEFORE..$GITHUB_SHA"))
        else
          commit_ids=("$GITHUB_SHA")
        fi

        for commit_id in "${commit_ids[@]}"; do
          subject=$(git show -s --format='%s' "$commit_id")
          if [[ "$subject" == "Merge pull request #"* \
            || "$subject" == "Merge branch 'master' into "* \
            || "$subject" == "Merge origin/develop into "* \
            || "$subject" == "Merge remote-tracking branch 'origin/develop'"* ]]; then
            continue
          fi

          author=$(git show -s --format='%an' "$commit_id")
          if [[ "$author" =~ [cC][lL][aA][uU][dD][eE]|[cC][hH][aA][tT][gG][pP][tT]|[cC][oO][dD][eE][xX] ]]; then
            author=''
          fi

          comment="$subject"
          if [[ -n "$author" ]]; then
            comment+="|||$author"
          fi

          jq -n \
            --arg id "$commit_id" \
            --arg comment "$comment" \
            --arg link_url "https://github.com/$GITHUB_REPOSITORY/commit/$commit_id" \
            '{Id: $id, Comment: $comment, LinkUrl: $link_url}' >> "$commits_file"
        done

        jq -n \
          --arg build_number "$GITHUB_RUN_ID/$GITHUB_RUN_NUMBER" \
          --arg build_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --arg branch "$GITHUB_REF_NAME" \
          --arg vcs_root "https://github.com/$GITHUB_REPOSITORY.git" \
          --arg vcs_commit_number "$GITHUB_SHA" \
          --arg vcs_commit_url "https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
          --slurpfile commits "$commits_file" \
          '{BuildEnvironment: "GitHub Actions", BuildNumber: $build_number, BuildUrl: $build_url, Branch: $branch, VcsType: "Git", VcsRoot: $vcs_root, VcsCommitNumber: $vcs_commit_number, VcsCommitUrl: $vcs_commit_url, Commits: $commits}' > "$build_information_file"

        octopus login --server "$OCTOPUS_SERVER" --api-key "$OCTOPUS_API_KEY"
        octopus build-information upload --space "NoWaste" --package-id "${{ inputs.docker_image_name }}" --version "${{ needs.build.outputs.gitversion }}" --file "$build_information_file" --overwrite-mode "ignore" --no-prompt

    - name: Octopus Create release
      env:
        IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        GITVERSION: ${{ needs.build.outputs.gitversion }}
        RELEASE_NOTES_FILE: ${{ steps.octopus-channel.outputs.notes_file }}
      run: |
          octopus login --server "${{ secrets.octopus_server_url }}" --api-key "${{ secrets.octopus_server_apikey }}"
          if [ -d "nomad" ]; then
            package_base_path="nomad"
            package_includes=(
              --include "${{ inputs.docker_image_name }}.*"
              --include "${{ inputs.docker_image_name }}_*.*"
            )
          elif [ -d "k8s" ]; then
            package_base_path="k8s"
            package_includes=(--include "*")
          else
            echo "No deployment package directory found. Expected nomad/ or k8s/."
            exit 1
          fi

          octopus package zip create --id "${{ inputs.docker_image_name }}" --version "${GITVERSION}" --base-path "${package_base_path}" "${package_includes[@]}"
          octopus package upload --space "Spaces-1" --package "${{ inputs.docker_image_name }}.${GITVERSION}.zip"
          octopus release create --space "Spaces-1" --project "${{ inputs.docker_image_name }}" --version "${GITVERSION}" --channel "${{ steps.octopus-channel.outputs.channel }}" --release-notes-file "$RELEASE_NOTES_FILE" --package "${{ inputs.docker_image_name }}:${GITVERSION}" --custom-field "ImageDigest:${IMAGE_DIGEST}"

          if ${{ steps.octopus-channel.outputs.autorelease }}; then
            octopus deploy-release --project "${{ inputs.docker_image_name }}" --version "${GITVERSION}" --tenant "*" --deployTo "${{ steps.octopus-channel.outputs.channel }}"
          fi

          echo '### Octopus release' >> $GITHUB_STEP_SUMMARY
          echo 'Pushed signed release of docker container **${{ inputs.docker_image_name }}** version **'"${GITVERSION}"'** to Octopus' >> $GITHUB_STEP_SUMMARY
