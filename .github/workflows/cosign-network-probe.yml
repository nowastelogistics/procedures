name: NWL-5834 Cosign network probe
on:
  push:
    branches:
      - feature/NWL-5834_Cosign_CI_Probe
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Check version
        run: cosign version
